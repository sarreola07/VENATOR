<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"
     role="img" aria-label="Venator message net: a phone sends a message through the machine holding a LoRa stick, one 915 MHz transmission reaches the ground station and the Jetson at once">
  <title>Venator — the message net</title>
  <style>
    #msg { transform-box: view-box; transform-origin: 0 0;
           transform: translate(250px, 200px); opacity: 0;
           animation: hop 12s linear infinite, kMsg 12s steps(1,end) infinite }
    @keyframes hop {
      0%,9%  { transform: translate(112px, 196px) }
      21%   { transform: translate(250px, 196px) }
      25%,100%{ transform: translate(250px, 250px) }
    }
    @keyframes kMsg { 0%,3.9% {opacity:0} 4%,25.9% {opacity:1} 26%,100% {opacity:0} }

    /* The wavefront. Stroke is kept off the transform so a 40x scale does not
       turn a 2px hairline into a slab. */
    #air { transform-box: view-box; transform-origin: 250px 268px;
           opacity: 0; animation: kAir 12s steps(1,end) infinite }
    #air circle { transform-box: fill-box; transform-origin: center;
                  animation: cast 2s cubic-bezier(.2,.6,.4,1) infinite }
    #air circle:nth-child(2) { animation-delay: .66s }
    #air circle:nth-child(3) { animation-delay: 1.32s }
    @keyframes cast { 0% { transform: scale(1); opacity: .9 }
                      100% { transform: scale(42); opacity: 0 } }
    @keyframes kAir { 0%,25.9% {opacity:0} 26%,53.9% {opacity:1} 54%,100% {opacity:0} }

    #hitG, #hitD { animation: kHit 12s steps(1,end) infinite }
    @keyframes kHit { 0%,49.9% {opacity:0} 50%,67.9% {opacity:1} 68%,100% {opacity:0} }

    #scrGL, #scrGP, #scrJ, #scrFL, #scrFP { animation: kScr 12s steps(1,end) infinite }
    @keyframes kScr { 0%,61.9% {opacity:0} 62%,89.9% {opacity:.28}
                      90%,100% {opacity:0} }
    #scrFP { animation: kType 12s steps(1,end) infinite }
    @keyframes kType { 0%,20% {opacity:.28} 20.1%,100% {opacity:0} }

    #bubble { animation: kBub 12s steps(1,end) infinite }
    @keyframes kBub { 0%,1.9% {opacity:0} 2%,25.9% {opacity:1} 26%,100% {opacity:0} }
    #deliv { animation: kDel 12s steps(1,end) infinite }
    @keyframes kDel { 0%,75.9% {opacity:0} 76%,89.9% {opacity:1} 90%,100% {opacity:0} }

    #ticker text { opacity: 0 }
    #m6 { opacity: 1 }
    #m0 { animation: km0 12s steps(1,end) infinite }
    #m1 { animation: km1 12s steps(1,end) infinite }
    #m2 { animation: km2 12s steps(1,end) infinite }
    #m3 { animation: km3 12s steps(1,end) infinite }
    #m4 { animation: km4 12s steps(1,end) infinite }
    #m5 { animation: km5 12s steps(1,end) infinite }
    #m6 { animation: km6 12s steps(1,end) infinite }
    @keyframes km0 { 0%,15.9% {opacity:1} 16%,100% {opacity:0} }
    @keyframes km1 { 0%,15.9% {opacity:0} 16%,25.9% {opacity:1} 26%,100% {opacity:0} }
    @keyframes km2 { 0%,25.9% {opacity:0} 26%,49.9% {opacity:1} 50%,100% {opacity:0} }
    @keyframes km3 { 0%,49.9% {opacity:0} 50%,61.9% {opacity:1} 62%,100% {opacity:0} }
    @keyframes km4 { 0%,61.9% {opacity:0} 62%,75.9% {opacity:1} 76%,100% {opacity:0} }
    @keyframes km5 { 0%,75.9% {opacity:0} 76%,89.9% {opacity:1} 90%,100% {opacity:0} }
    @keyframes km6 { 0%,89.9% {opacity:0} 90%,100% {opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      #msg, #air, #air circle { animation: none }
      #air, #msg, #bubble, #deliv { display: none }
      #hitG, #hitD { opacity: 0; animation: none }
      #scrGL, #scrGP, #scrJ { opacity: .28; animation: none }
      #scrFL, #scrFP { opacity: 0; animation: none }
      #ticker text { animation: none; opacity: 0 }
      #m6 { opacity: 1 }
    }
  </style>
  <rect width="1000" height="400" fill="#F2F1EE"/>

  <text x="56" y="42" fill="#6E6B66" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11"
    font-weight="600" letter-spacing="3.4">THE MESSAGE NET</text>
  <text x="56" y="62" fill="#0A0A0A" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
    One transmission on 915 MHz — every stick on the channel hears it</text>

  <!-- FIELD -->
  <rect x="56" y="92" width="290" height="205" fill="#FFFFFF" stroke="#DAD8D3" stroke-width="1.5"/>
  <text x="74" y="118" fill="#0A0A0A" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12"
    font-weight="600" letter-spacing="2.2">FIELD</text>
  <g transform="translate(112,196) scale(1.0)">
      <rect x="-11" y="-19" width="22" height="38" rx="3.5" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.6"/>
      <rect id="scrFP" x="-7.5" y="-14" width="15" height="26" fill="#E05316" opacity="0"/>
      <text x="0" y="31" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9"
        text-anchor="middle">phone</text></g>
  <g transform="translate(250,196) scale(1.0)">
      <rect x="-22" y="-16" width="44" height="28" rx="2" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.6"/>
      <rect id="scrFL" x="-18" y="-12" width="36" height="20" fill="#E05316" opacity="0"/>
      <path d="M-29 14h58" stroke="#0A0A0A" stroke-width="2"/>
      <text x="0" y="28" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9"
        text-anchor="middle">phone_relay.py</text></g>
  <path d="M130 196h95" stroke="#0A0A0A" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M250 214v34" stroke="#0A0A0A" stroke-width="1.2"/>
  <g transform="translate(250,268)">
      <rect x="-6" y="-11" width="12" height="22" rx="1.5" fill="#0A0A0A"/>
      <path d="M0 -11v-13" stroke="#6E6B66" stroke-width="1.5"/>
      <circle r="17" fill="none" stroke="#E05316" stroke-width="2" opacity="0"/></g>
  <g id="bubble" transform="translate(112,150)">
    <rect x="-52" y="-16" width="150" height="26" rx="3" fill="#FFFFFF"
      stroke="#E05316" stroke-width="1.3"/>
    <text x="-44" y="2" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">"patrol clear, all ok"</text>
  </g>
  <g id="deliv" transform="translate(250,300)">
    <text x="0" y="0" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11"
      text-anchor="middle" letter-spacing="1.2">delivered 2 of 2</text>
  </g>

  <g id="air" transform="translate(250,268)"><circle r="12" fill="none" stroke="#E05316" stroke-width="2" vector-effect="non-scaling-stroke"/><circle r="12" fill="none" stroke="#E05316" stroke-width="2" vector-effect="non-scaling-stroke"/><circle r="12" fill="none" stroke="#E05316" stroke-width="2" vector-effect="non-scaling-stroke"/></g>

  <!-- GROUND -->
  <rect x="640" y="92" width="304" height="96" fill="#FFFFFF" stroke="#DAD8D3" stroke-width="1.5"/>
  <text x="658" y="116" fill="#0A0A0A" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12"
    font-weight="600" letter-spacing="2.2">GROUND</text>
  <g transform="translate(688,150)">
      <rect x="-6" y="-11" width="12" height="22" rx="1.5" fill="#0A0A0A"/>
      <path d="M0 -11v-13" stroke="#6E6B66" stroke-width="1.5"/>
      <circle id="hitG" r="17" fill="none" stroke="#E05316" stroke-width="2" opacity="0"/></g>
  <g transform="translate(790,146) scale(0.85)">
      <rect x="-22" y="-16" width="44" height="28" rx="2" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.6"/>
      <rect id="scrGL" x="-18" y="-12" width="36" height="20" fill="#E05316" opacity="0"/>
      <path d="M-29 14h58" stroke="#0A0A0A" stroke-width="2"/>
      <text x="0" y="28" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9"
        text-anchor="middle">laptop</text></g>
  <g transform="translate(898,144) scale(0.8)">
      <rect x="-11" y="-19" width="22" height="38" rx="3.5" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.6"/>
      <rect id="scrGP" x="-7.5" y="-14" width="15" height="26" fill="#E05316" opacity="0"/>
      <text x="0" y="31" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9"
        text-anchor="middle">phone</text></g>
  <path d="M700 150h56M820 146h50" stroke="#0A0A0A" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- DRONE -->
  <rect x="640" y="206" width="304" height="96" fill="#FFFFFF" stroke="#DAD8D3" stroke-width="1.5"/>
  <text x="658" y="230" fill="#0A0A0A" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12"
    font-weight="600" letter-spacing="2.2">DRONE</text>
  <g transform="translate(688,264)">
      <rect x="-6" y="-11" width="12" height="22" rx="1.5" fill="#0A0A0A"/>
      <path d="M0 -11v-13" stroke="#6E6B66" stroke-width="1.5"/>
      <circle id="hitD" r="17" fill="none" stroke="#E05316" stroke-width="2" opacity="0"/></g>
  <g transform="translate(790,260) scale(0.85)">
      <rect x="-22" y="-16" width="44" height="28" rx="2" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.6"/>
      <rect id="scrJ" x="-18" y="-12" width="36" height="20" fill="#E05316" opacity="0"/>
      <path d="M-29 14h58" stroke="#0A0A0A" stroke-width="2"/>
      <text x="0" y="28" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9"
        text-anchor="middle">Jetson</text></g>
  <path d="M700 264h56" stroke="#0A0A0A" stroke-width="1.2" stroke-dasharray="3 3"/>
  <g transform="translate(898,262) scale(.9)">
    <path d="M-17 -2h34" stroke="#0A0A0A" stroke-width="2.4"/>
    <path d="M-17 -2l-3 -5M17 -2l3 -5" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="-8" y="-4" width="16" height="8" rx="1.5" fill="#0A0A0A"/>
    <ellipse cx="-20" cy="-7.5" rx="9" ry="1.4" fill="#6E6B66"/>
    <ellipse cx="20" cy="-7.5" rx="9" ry="1.4" fill="#6E6B66"/>
  </g>

  <g id="msg">
    <rect x="-7" y="-7" width="14" height="14" rx="2.5" fill="#E05316"/>
  </g>

  <text x="470" y="330" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5"
    text-anchor="middle">a phone is never on the air —</text>
  <text x="470" y="344" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5"
    text-anchor="middle">it loads a page from the machine holding the stick</text>

  <g id="ticker">
    <text id="m0" x="56" y="378" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">field · typing on the relay page  ·  up to 180 characters</text>
    <text id="m1" x="56" y="378" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">phone  →  host over local HTTP  →  its stick</text>
    <text id="m2" x="56" y="378" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">one transmission  ·  915 MHz SF7  ·  no addressing needed to be heard</text>
    <text id="m3" x="56" y="378" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">ground and Jetson receive it at the same instant</text>
    <text id="m4" x="56" y="378" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">each stick hands the text to its own browsers</text>
    <text id="m5" x="56" y="378" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">delivered 2 of 2  ·  confirmed per peer, not a bare tick</text>
    <text id="m6" x="56" y="378" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">Designed behaviour — today the relay ACKs before dedup and has no "from". ROADMAP decision 5.</text>
  </g>
</svg>
