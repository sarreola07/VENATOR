<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" width="1000" height="384"
     role="img" aria-label="Venator system self-test: radio, link, flight controller, camera, compute and C2 all OK; GPS not fitted; then ready and the aircraft lifts">
  <title>Venator — system self-test</title>
  <style>
    #cur { animation: blink 1.05s steps(1,end) infinite }
    @keyframes blink { 0%,55% {opacity:1} 56%,100% {opacity:0} }
    #sweep { transform-box: view-box; transform-origin: 0 0;
             animation: sweep 10s cubic-bezier(.4,0,.2,1) infinite }
    @keyframes sweep { 0% {transform:translateX(-40px); opacity:0}
      4% {opacity:.9} 46% {opacity:.9} 54%,100% {transform:translateX(1040px); opacity:0} }

    #ready { animation: rdy 10s steps(1,end) infinite }
    @keyframes rdy { 0%,55.99% {opacity:0} 56%,100% {opacity:1} }
    #readyGlow { animation: pulse 1.4s ease-in-out infinite,
                            rdy 10s steps(1,end) infinite }
    @keyframes pulse { 0%,100% {opacity:.9} 50% {opacity:.35} }

    #craft { transform-box: view-box; transform-origin: 0 0;
             transform: translate(858px, 196px);
             animation: lift 10s cubic-bezier(.3,0,.3,1) infinite }
    @keyframes lift {
      0%,59%  { transform: translate(858px, 300px) }
      78%, 100% { transform: translate(858px, 196px) }
    }
    #rotorL, #rotorR { transform-box: fill-box; transform-origin: center;
                       animation: spin .3s linear infinite }
    @keyframes spin { 0%,100% {transform:scaleX(1)} 50% {transform:scaleX(.28)} }
    #ln0 { animation: r0 10s steps(1,end) infinite }
    #ok0 { animation: o0 10s steps(1,end) infinite }
    #ln1 { animation: r1 10s steps(1,end) infinite }
    #ok1 { animation: o1 10s steps(1,end) infinite }
    #ln2 { animation: r2 10s steps(1,end) infinite }
    #ok2 { animation: o2 10s steps(1,end) infinite }
    #ln3 { animation: r3 10s steps(1,end) infinite }
    #ok3 { animation: o3 10s steps(1,end) infinite }
    #ln4 { animation: r4 10s steps(1,end) infinite }
    #ok4 { animation: o4 10s steps(1,end) infinite }
    #ln5 { animation: r5 10s steps(1,end) infinite }
    #ok5 { animation: o5 10s steps(1,end) infinite }
    #ln6 { animation: r6 10s steps(1,end) infinite }
    #ok6 { animation: o6 10s steps(1,end) infinite }
    @keyframes r0 { 0%,4.99% {opacity:0} 5%,100% {opacity:1} }
    @keyframes o0 { 0%,8.39% {opacity:0} 8.4%,100% {opacity:1} }
    @keyframes r1 { 0%,11.19% {opacity:0} 11.2%,100% {opacity:1} }
    @keyframes o1 { 0%,14.59% {opacity:0} 14.6%,100% {opacity:1} }
    @keyframes r2 { 0%,17.39% {opacity:0} 17.4%,100% {opacity:1} }
    @keyframes o2 { 0%,20.79% {opacity:0} 20.8%,100% {opacity:1} }
    @keyframes r3 { 0%,23.59% {opacity:0} 23.6%,100% {opacity:1} }
    @keyframes o3 { 0%,26.99% {opacity:0} 27%,100% {opacity:1} }
    @keyframes r4 { 0%,29.79% {opacity:0} 29.8%,100% {opacity:1} }
    @keyframes o4 { 0%,33.19% {opacity:0} 33.2%,100% {opacity:1} }
    @keyframes r5 { 0%,35.99% {opacity:0} 36%,100% {opacity:1} }
    @keyframes o5 { 0%,39.39% {opacity:0} 39.4%,100% {opacity:1} }
    @keyframes r6 { 0%,42.19% {opacity:0} 42.2%,100% {opacity:1} }
    @keyframes o6 { 0%,45.59% {opacity:0} 45.6%,100% {opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      #sweep { display: none }
      #cur, #rotorL, #rotorR, #readyGlow { animation: none }
      #craft { animation: none }
      [id^="ln"], [id^="ok"], #ready, #readyGlow { animation: none; opacity: 1 }
    }
  </style>
  <defs>
    <clipPath id="pc"><rect width="1000" height="384"/></clipPath>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1000" height="384" fill="#131314"/>
  <g clip-path="url(#pc)">
