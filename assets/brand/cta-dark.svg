<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 92" width="400" height="92"
     role="img" aria-label="System overview — an animated walkthrough">
  <title>System overview</title>
  <style>
    #sweep { transform-box: view-box; transform-origin: 0 0;
             animation: sweep 3.6s cubic-bezier(.35,0,.2,1) infinite }
    @keyframes sweep {
      0%       { transform: translateX(-40px); opacity: 0 }
      10%      { opacity: 1 }
      55%      { opacity: 1 }
      64%,100% { transform: translateX(440px); opacity: 0 }
    }
    #edge { animation: burn 2.4s ease-in-out infinite }
    @keyframes burn { 0%,100% { opacity: .95 } 50% { opacity: .55 } }

    #dot { transform-box: fill-box; transform-origin: center;
           animation: beat 1.6s ease-in-out infinite }
    @keyframes beat { 0%,100% { transform: scale(1) } 50% { transform: scale(.66) } }
    #halo { transform-box: fill-box; transform-origin: center;
            animation: halo 1.6s ease-out infinite }
    @keyframes halo { 0% { transform: scale(1); opacity:.6 }
                      70%,100% { transform: scale(3.6); opacity:0 } }

    #cur { animation: blink 1.05s steps(1,end) infinite }
    @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }

    #cv0, #cv1, #cv2 { animation: chase 1.5s ease-in-out infinite }
    #cv1 { animation-delay: .16s }
    #cv2 { animation-delay: .32s }
    @keyframes chase { 0%,100% { opacity: .22 } 22% { opacity: 1 } }

    /* Glitch: a short tear every few seconds, not a constant wobble. */
    #gTop, #gBot, #gGhost { opacity: 0 }
    #gTop { transform-box: view-box; transform-origin: 0 0;
            animation: gtop 5.2s steps(1,end) infinite }
    #gBot { transform-box: view-box; transform-origin: 0 0;
            animation: gbot 5.2s steps(1,end) infinite }
    #gGhost { transform-box: view-box; transform-origin: 0 0;
              animation: gghost 5.2s steps(1,end) infinite }
    @keyframes gtop { 0%,71% {opacity:0; transform:translateX(0)}
      72% {opacity:1; transform:translateX(-5px)}
      74% {opacity:1; transform:translateX(3px)}
      76%,100% {opacity:0; transform:translateX(0)} }
    @keyframes gbot { 0%,71% {opacity:0; transform:translateX(0)}
      72% {opacity:1; transform:translateX(4px)}
      74% {opacity:1; transform:translateX(-3px)}
      76%,100% {opacity:0; transform:translateX(0)} }
    @keyframes gghost { 0%,70.9% {opacity:0}
      71% {opacity:.85; transform:translate(2px,-1px)}
      76%,100% {opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      #sweep, #halo, #gTop, #gBot, #gGhost { display: none }
      #edge, #dot, #cur, #cv0, #cv1, #cv2 { animation: none; opacity: 1 }
    }
  </style>
  <defs>
    <clipPath id="panelClip"><path d="M20 1 H399 V71 L379 91 H1 V21 Z"/></clipPath>
    <clipPath id="halfTop"><rect x="0" y="0" width="400" height="41"/></clipPath>
    <clipPath id="halfBot"><rect x="0" y="41" width="400" height="54"/></clipPath>
    <filter id="neon" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <path d="M20 1 H399 V71 L379 91 H1 V21 Z" fill="#131314"/>
  <g clip-path="url(#panelClip)">
    <path d="M0 3H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 7H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 11H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 15H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 19H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 23H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 27H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 31H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 35H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 39H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 43H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 47H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 51H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 55H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 59H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 63H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 67H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 71H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 75H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 79H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 83H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 87H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/><path d="M0 91H400" stroke="#F2F1EE" stroke-width="1" opacity=".05"/>
    <g id="sweep">
      <rect x="0" y="0" width="3" height="92" fill="#FF7A3D" filter="url(#soft)" opacity=".9"/>
      <rect x="0" y="0" width="1.4" height="92" fill="#FFFFFF" opacity=".9"/>
    </g>
  </g>

  <path id="edge" d="M20 1 H399 V71 L379 91 H1 V21 Z" fill="none" stroke="#E05316" stroke-width="2" filter="url(#neon)"/>

  <circle id="halo" cx="34" cy="42" r="5.5" fill="#E05316"/>
  <circle id="dot" cx="34" cy="42" r="5.5" fill="#FF7A3D" filter="url(#neon)"/>

  <text x="60" y="48" fill="#F2F1EE" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2.9">SYSTEM OVERVIEW</text>
  <text x="60" y="70" fill="#9A968F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5"
    letter-spacing="1.4">animated · 60 seconds</text>
  <g id="gGhost"><text x="60" y="48" fill="#E05316" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2.9">SYSTEM OVERVIEW</text></g>
  <g id="gTop" clip-path="url(#halfTop)"><text x="60" y="48" fill="#F2F1EE" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2.9">SYSTEM OVERVIEW</text></g>
  <g id="gBot" clip-path="url(#halfBot)"><text x="60" y="48" fill="#F2F1EE" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2.9">SYSTEM OVERVIEW</text></g>

  <rect id="cur" x="296" y="33" width="10" height="18" fill="#FF7A3D" filter="url(#neon)"/>
  <path id="cv0" d="M332 37l9 9-9 9" fill="none" stroke="#E05316" stroke-width="2.6" stroke-linecap="square"/><path id="cv1" d="M347 37l9 9-9 9" fill="none" stroke="#E05316" stroke-width="2.6" stroke-linecap="square"/><path id="cv2" d="M362 37l9 9-9 9" fill="none" stroke="#E05316" stroke-width="2.6" stroke-linecap="square"/>
</svg>
