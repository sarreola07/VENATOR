<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380"
     role="img" aria-label="Forward obstacle avoidance, not built: the depth camera finds a wall, PX4 brakes at CP_DIST, the aircraft routes around and rejoins">
  <title>Venator — forward obstacle avoidance (Phase 6, not started)</title>
  <style>
    #craft { transform-box: view-box; transform-origin: 0 0;
             transform: translate(478px, 142px);
             animation: fly 14s linear infinite, fade 14s linear infinite }
    @keyframes fly {
      0% { transform: translate(120px, 208px) }
      14% { transform: translate(300px, 208px) }
      30% { transform: translate(430px, 208px) }
      48% { transform: translate(478px, 142px) }
      58% { transform: translate(610px, 126px) }
      64% { transform: translate(700px, 166px) }
      79% { transform: translate(880px, 208px) }
      100% { transform: translate(880px, 208px) }
    }
    @keyframes fade { 0% {opacity:0} 2.5% {opacity:1} 96% {opacity:1} 100% {opacity:0} }
    #rotor circle { transform-box: fill-box; transform-origin: center;
                    animation: spin .3s linear infinite }
    @keyframes spin { 0%,100% {transform:scaleX(1)} 50% {transform:scaleX(.3)} }

    #fan { animation: fan 2.2s ease-in-out infinite }
    @keyframes fan { 0%,100% {opacity:.20} 50% {opacity:.42} }

    #cpring { transform-box: fill-box; transform-origin: center;
              animation: kCp 14s steps(1,end) infinite }
    @keyframes kCp { 0%,29.99% {opacity:0} 30%,63.99% {opacity:1} 64%,100% {opacity:0} }
    #hits { animation: kHit 14s steps(1,end) infinite }
    @keyframes kHit { 0%,13.99% {opacity:0} 14%,63.99% {opacity:1} 64%,100% {opacity:0} }
    #devpath { animation: kDev 14s steps(1,end) infinite }
    @keyframes kDev { 0%,39.99% {opacity:0} 40%,100% {opacity:1} }
    #ro0 { animation: q0 14s steps(1,end) infinite }
    #ro1 { animation: q1 14s steps(1,end) infinite }
    #ro2 { animation: q2 14s steps(1,end) infinite }
    #ro3 { animation: q3 14s steps(1,end) infinite }
    #ro4 { animation: q4 14s steps(1,end) infinite }
    #ro5 { animation: q5 14s steps(1,end) infinite }
    #ro6 { animation: q6 14s steps(1,end) infinite }
    #ro7 { animation: q7 14s steps(1,end) infinite }
    #ro8 { animation: q8 14s steps(1,end) infinite }
    @keyframes q0 { 0%,13.99% {opacity:1} 14%,100% {opacity:0} }
    @keyframes q1 { 0%,13.99% {opacity:0} 14%,19.99% {opacity:1} 20%,100% {opacity:0} }
    @keyframes q2 { 0%,19.99% {opacity:0} 20%,24.99% {opacity:1} 25%,100% {opacity:0} }
    @keyframes q3 { 0%,24.99% {opacity:0} 25%,29.99% {opacity:1} 30%,100% {opacity:0} }
    @keyframes q4 { 0%,29.99% {opacity:0} 30%,39.99% {opacity:1} 40%,100% {opacity:0} }
    @keyframes q5 { 0%,39.99% {opacity:0} 40%,47.99% {opacity:1} 48%,100% {opacity:0} }
    @keyframes q6 { 0%,47.99% {opacity:0} 48%,63.99% {opacity:1} 64%,100% {opacity:0} }
    @keyframes q7 { 0%,63.99% {opacity:0} 64%,78.99% {opacity:1} 79%,100% {opacity:0} }
    @keyframes q8 { 0%,78.99% {opacity:0} 79%,100% {opacity:1} }
    #ticker text { opacity: 0 }
    #a5 { opacity: 1 }
    #a0 { animation: ka0 14s steps(1,end) infinite }
    #a1 { animation: ka1 14s steps(1,end) infinite }
    #a2 { animation: ka2 14s steps(1,end) infinite }
    #a3 { animation: ka3 14s steps(1,end) infinite }
    #a4 { animation: ka4 14s steps(1,end) infinite }
    #a5 { animation: ka5 14s steps(1,end) infinite }
    @keyframes ka0 { 0%,13.99% {opacity:1} 14%,100% {opacity:0} }
    @keyframes ka1 { 0%,13.99% {opacity:0} 14%,29.99% {opacity:1} 30%,100% {opacity:0} }
    @keyframes ka2 { 0%,29.99% {opacity:0} 30%,39.99% {opacity:1} 40%,100% {opacity:0} }
    @keyframes ka3 { 0%,39.99% {opacity:0} 40%,63.99% {opacity:1} 64%,100% {opacity:0} }
    @keyframes ka4 { 0%,63.99% {opacity:0} 64%,78.99% {opacity:1} 79%,100% {opacity:0} }
    @keyframes ka5 { 0%,78.99% {opacity:0} 79%,100% {opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      #craft, #rotor circle, #fan { animation: none }
      #craft { opacity: 1 }
      #fan { opacity: .3 }
      #cpring, #hits, #devpath { opacity: 1; animation: none }
      [id^="ro"] { animation: none; opacity: 0 }
      #ro6 { opacity: 1 }
      #ticker text { animation: none; opacity: 0 }
      #a5 { opacity: 1 }
    }
  </style>
  <rect width="1000" height="380" fill="#F2F1EE"/>
  <path d="M104 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M152 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M200 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M248 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M296 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M344 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M392 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M440 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M488 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M536 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M584 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M632 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M680 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M728 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M776 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M824 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M872 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M920 84V330" stroke="#E6E4E0" stroke-width="1"/><path d="M56 96H944" stroke="#E6E4E0" stroke-width="1"/><path d="M56 144H944" stroke="#E6E4E0" stroke-width="1"/><path d="M56 192H944" stroke="#E6E4E0" stroke-width="1"/><path d="M56 240H944" stroke="#E6E4E0" stroke-width="1"/><path d="M56 288H944" stroke="#E6E4E0" stroke-width="1"/>
  <rect x="56" y="84" width="888" height="246" fill="none" stroke="#DAD8D3" stroke-width="1.5"/>

  <text x="56" y="44" fill="#6E6B66" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11"
    font-weight="600" letter-spacing="3.4">FORWARD OBSTACLE AVOIDANCE</text>
  <text x="56" y="64" fill="#0A0A0A" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
    Phase 6 — see it, brake, go around, rejoin</text>

