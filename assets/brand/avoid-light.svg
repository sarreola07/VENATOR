  <g id="craft">
    <g id="fan" opacity=".2">
      <path d="M0 0 L205 -118 A205 205 0 0 1 205 118 Z" fill="#E05316"/>
    </g>
    <circle r="50" fill="none" stroke="#E05316" stroke-width="1" opacity=".28" stroke-dasharray="3 5"/><circle r="100" fill="none" stroke="#E05316" stroke-width="1" opacity=".28" stroke-dasharray="3 5"/><circle r="150" fill="none" stroke="#E05316" stroke-width="1" opacity=".28" stroke-dasharray="3 5"/><circle r="200" fill="none" stroke="#E05316" stroke-width="1" opacity=".28" stroke-dasharray="3 5"/>
    <circle id="cpring" r="100" fill="none" stroke="#E05316" stroke-width="2" opacity="0"/>
    <g id="rotor" fill="#6E6B66">
      <circle cx="-15" cy="-9" r="6"/><circle cx="15" cy="-9" r="6"/>
      <circle cx="-15" cy="9" r="6"/><circle cx="15" cy="9" r="6"/>
      <circle cx="0" cy="-13" r="6"/><circle cx="0" cy="13" r="6"/>
    </g>
    <path d="M-15-9L15 9M15-9L-15 9M0-13V13" stroke="#0A0A0A" stroke-width="2"/>
    <circle r="6.5" fill="#0A0A0A"/>
    <g transform="translate(0,-46)"><text id="ro0" x="0" y="0" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle" letter-spacing="1">OBST  --</text><text id="ro1" x="0" y="0" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle" letter-spacing="1">OBST  8.0 m</text><text id="ro2" x="0" y="0" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle" letter-spacing="1">OBST  6.4 m</text><text id="ro3" x="0" y="0" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle" letter-spacing="1">OBST  5.1 m</text><text id="ro4" x="0" y="0" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle" letter-spacing="1">OBST  4.0 m</text><text id="ro5" x="0" y="0" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle" letter-spacing="1">BRAKE</text><text id="ro6" x="0" y="0" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle" letter-spacing="1">DEVIATE</text><text id="ro7" x="0" y="0" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle" letter-spacing="1">CLEAR</text><text id="ro8" x="0" y="0" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle" letter-spacing="1">OBST  --</text></g>
  </g>

  <g>
    <defs><clipPath id="oc"><rect x="500" y="168" width="62" height="150"/></clipPath></defs>
    <rect x="500" y="168" width="62" height="150" fill="#F2F1EE"/>
    <g clip-path="url(#oc)"><path d="M344 318L494 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M357 318L507 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M370 318L520 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M383 318L533 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M396 318L546 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M409 318L559 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M422 318L572 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M435 318L585 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M448 318L598 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M461 318L611 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M474 318L624 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M487 318L637 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M500 318L650 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M513 318L663 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M526 318L676 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M539 318L689 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M552 318L702 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M565 318L715 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M578 318L728 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/><path d="M591 318L741 168" stroke="#6E6B66" stroke-width="1" opacity=".5"/></g>
    <rect x="500" y="168" width="62" height="150" fill="none" stroke="#0A0A0A" stroke-width="1.6"/>
