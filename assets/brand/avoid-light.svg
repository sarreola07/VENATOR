      font-size="10" text-anchor="middle" letter-spacing="1">OBSTACLE</text>
  </g>
  <g id="hits" opacity="0"><path d="M493 182h9" stroke="#E05316" stroke-width="2.4"/><path d="M493 201h9" stroke="#E05316" stroke-width="2.4"/><path d="M493 220h9" stroke="#E05316" stroke-width="2.4"/><path d="M493 239h9" stroke="#E05316" stroke-width="2.4"/><path d="M493 258h9" stroke="#E05316" stroke-width="2.4"/><path d="M493 277h9" stroke="#E05316" stroke-width="2.4"/><path d="M493 296h9" stroke="#E05316" stroke-width="2.4"/></g>

  <g id="ticker">
    <text id="a0" x="56" y="358" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="0.8">AUTO.MISSION  ·  cruising the leg</text>
    <text id="a1" x="56" y="358" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="0.8">OAK-D stereo depth  →  return ahead, closing</text>
    <text id="a2" x="56" y="358" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="0.8">OBSTACLE_DISTANCE  →  PX4 brakes at CP_DIST</text>
    <text id="a3" x="56" y="358" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="0.8">deviating  ·  the planned line is not flyable</text>
    <text id="a4" x="56" y="358" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="0.8">clear  ·  rejoining the route</text>
    <text id="a5" x="56" y="358" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="0.8">Phase 6 — not started. The depth camera and the PX4 side both exist; the link between them does not.</text>
  </g>
