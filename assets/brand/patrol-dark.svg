<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420"
     role="img" aria-label="Venator patrol: four coordinates uploaded over LoRa, validated, armed, flown as a circuit, then RTL home">
  <title>Venator — fly to these coordinates (target system)</title>
  <style>
    #drone { transform-box: view-box; transform-origin: 0 0;
             transform: translate(585px, 116px);
             animation: fly 16s linear infinite }
    @keyframes fly {
      0%,33% { transform: translate(150px, 316px) }
      39%     { transform: translate(150px, 316px) }
      46.3581% { transform: translate(320px, 150px) }
      54.6318% { transform: translate(585px, 116px) }
      56.6608% { transform: translate(648px, 98px) }
      59.2746% { transform: translate(730px, 118px) }
      63.9301% { transform: translate(812px, 244px) }
      73% { transform: translate(536px, 342px) }
      87%,100%  { transform: translate(150px, 316px) }
    }
    #rotor circle { transform-box: fill-box; transform-origin: center;
                    animation: spin .3s linear infinite }
    @keyframes spin { 0%,100% { transform: scaleX(1) } 50% { transform: scaleX(.3) } }

    /* The flown line grows under the aircraft: same schedule, dashoffset to 0. */
    #flownA { animation: drawA 16s linear infinite }
    @keyframes drawA { 0%,39% { stroke-dashoffset: 504.8 }
                       54.6318%,100% { stroke-dashoffset: 0 } }
    #flownB { animation: drawB 16s linear infinite }
    @keyframes drawB { 0%,63.9301% { stroke-dashoffset: 292.9 }
                       73%,100% { stroke-dashoffset: 0 } }
    /* The deviation is dashed to mark it as the one thing here that is not
       built, so it reveals rather than grows — dasharray is already spent. */
    #dev, #devChip, #obstWarn { opacity:0; animation: kDev 16s steps(1,end) infinite }
    @keyframes kDev { 0%,54.5318% {opacity:0} 54.6318%,100% {opacity:1} }
    #rtl { stroke-dasharray: 386.9; stroke-dashoffset: 386.9;
           animation: drawR 16s linear infinite }
    @keyframes drawR {
      0%,73%   { stroke-dashoffset: 386.9 }
      87%     { stroke-dashoffset: 0 }
      100%        { stroke-dashoffset: 0 }
    }
    #plan  { opacity:0; animation: kPlan 16s steps(1,end) infinite }
    #armed { opacity:0; animation: kArm 16s steps(1,end) infinite }
    #ping  { opacity:0; animation: kPing 16s steps(1,end) infinite }
    #ping circle { transform-box: fill-box; transform-origin: center;
                   animation: ping 1.3s linear infinite }
    #ping circle:nth-child(2) { animation-delay: .43s }
    #ping circle:nth-child(3) { animation-delay: .86s }
    @keyframes ping { 0% { transform: scale(1); opacity:.8 }
                      100% { transform: scale(6.5); opacity:0 } }
    @keyframes kPlan { 0%,4% {opacity:0} 4.1%,100% {opacity:1} }
    @keyframes kArm  { 0%,30% {opacity:0} 30.1%,87% {opacity:1}
                       87.1%,100% {opacity:0} }
    @keyframes kPing { 0%,8.9% {opacity:0} 9%,30% {opacity:1}
                       30.1%,100% {opacity:0} }
    #wpOn0, #wpNum0 { opacity:0; animation: kwp0 16s steps(1,end) infinite }
    #wpOn1, #wpNum1 { opacity:0; animation: kwp1 16s steps(1,end) infinite }
    #wpOn2, #wpNum2 { opacity:0; animation: kwp2 16s steps(1,end) infinite }
    #wpOn3, #wpNum3 { opacity:0; animation: kwp3 16s steps(1,end) infinite }
    @keyframes kwp0 { 0%,46.2581% {opacity:0} 46.3581%,100% {opacity:1} }
    @keyframes kwp1 { 0%,54.5318% {opacity:0} 54.6318%,100% {opacity:1} }
    @keyframes kwp2 { 0%,63.8301% {opacity:0} 63.9301%,100% {opacity:1} }
    @keyframes kwp3 { 0%,72.9% {opacity:0} 73%,100% {opacity:1} }
    #ticker text { opacity:0 }
    #p7 { opacity:1 }
    #p0 { animation: kp0 16s steps(1,end) infinite }
    #p1 { animation: kp1 16s steps(1,end) infinite }
    #p2 { animation: kp2 16s steps(1,end) infinite }
    #p3 { animation: kp3 16s steps(1,end) infinite }
    #p4 { animation: kp4 16s steps(1,end) infinite }
    #p4b { animation: kp4b 16s steps(1,end) infinite }
    #p4c { animation: kp4c 16s steps(1,end) infinite }
    #p5 { animation: kp5 16s steps(1,end) infinite }
    #p6 { animation: kp6 16s steps(1,end) infinite }
    #p7 { animation: kp7 16s steps(1,end) infinite }
    @keyframes kp0 { 0%,8.9% {opacity:1} 9%,100% {opacity:0} }
    @keyframes kp1 { 0%,8.9% {opacity:0} 9%,25.9% {opacity:1} 26%,100% {opacity:0} }
    @keyframes kp2 { 0%,25.9% {opacity:0} 26%,32.9% {opacity:1} 33%,100% {opacity:0} }
    @keyframes kp3 { 0%,32.9% {opacity:0} 33%,38.9% {opacity:1} 39%,100% {opacity:0} }
    @keyframes kp4 { 0%,38.9% {opacity:0} 39%,54.5318% {opacity:1} 54.6318%,100% {opacity:0} }
    @keyframes kp4b { 0%,54.5318% {opacity:0} 54.6318%,63.8301% {opacity:1} 63.9301%,100% {opacity:0} }
    @keyframes kp4c { 0%,63.8301% {opacity:0} 63.9301%,72.9% {opacity:1} 73%,100% {opacity:0} }
    @keyframes kp5 { 0%,72.9% {opacity:0} 73%,86.9% {opacity:1} 87%,100% {opacity:0} }
    @keyframes kp6 { 0%,86.9% {opacity:0} 87%,92.9% {opacity:1} 93%,100% {opacity:0} }
    @keyframes kp7 { 0%,92.9% {opacity:0} 93%,100% {opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      #drone, #rotor circle, #ping, #ping circle { animation: none }
      #ping { display: none }
      #flownA, #flownB, #rtl { animation: none; stroke-dashoffset: 0 }
      #dev, #devChip, #obstWarn { opacity: 1; animation: none }
      #plan, #armed { opacity: 1; animation: none }
      [id^="wpOn"], [id^="wpNum"] { opacity: 1; animation: none }
      #ticker text { animation: none; opacity: 0 }
      #p7 { opacity: 1 }
    }
  </style>
  <rect width="1000" height="420" fill="#0A0A0A"/>
  <path d="M96 74V356" stroke="#151516" stroke-width="1"/><path d="M144 74V356" stroke="#151516" stroke-width="1"/><path d="M192 74V356" stroke="#151516" stroke-width="1"/><path d="M240 74V356" stroke="#151516" stroke-width="1"/><path d="M288 74V356" stroke="#151516" stroke-width="1"/><path d="M336 74V356" stroke="#151516" stroke-width="1"/><path d="M384 74V356" stroke="#151516" stroke-width="1"/><path d="M432 74V356" stroke="#151516" stroke-width="1"/><path d="M480 74V356" stroke="#151516" stroke-width="1"/><path d="M528 74V356" stroke="#151516" stroke-width="1"/><path d="M576 74V356" stroke="#151516" stroke-width="1"/><path d="M624 74V356" stroke="#151516" stroke-width="1"/><path d="M672 74V356" stroke="#151516" stroke-width="1"/><path d="M720 74V356" stroke="#151516" stroke-width="1"/><path d="M768 74V356" stroke="#151516" stroke-width="1"/><path d="M816 74V356" stroke="#151516" stroke-width="1"/><path d="M864 74V356" stroke="#151516" stroke-width="1"/><path d="M912 74V356" stroke="#151516" stroke-width="1"/><path d="M56 84H932" stroke="#151516" stroke-width="1"/><path d="M56 132H932" stroke="#151516" stroke-width="1"/><path d="M56 180H932" stroke="#151516" stroke-width="1"/><path d="M56 228H932" stroke="#151516" stroke-width="1"/><path d="M56 276H932" stroke="#151516" stroke-width="1"/><path d="M56 324H932" stroke="#151516" stroke-width="1"/>
  <rect x="56" y="74" width="876" height="282" fill="none" stroke="#2A2A27" stroke-width="1.5"/>

  <text x="56" y="44" fill="#8A8781" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11"
    font-weight="600" letter-spacing="3.4">FLY TO THESE COORDINATES</text>
  <text x="56" y="64" fill="#F2F1EE" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
    Phase 5 — upload a route over LoRa, fly the patrol, come home</text>

  <path id="plan" d="M150,316 L320,150 L585,116 L812,244 L536,342" fill="none" stroke="#8A8781"
    stroke-width="1.2" stroke-dasharray="5 5"/>
  <g>
    <defs><clipPath id="oclip"><rect x="664" y="152" width="72" height="56"/></clipPath></defs>
    <g clip-path="url(#oclip)"><path d="M612 208L668 152" stroke="#8A8781" stroke-width="1" opacity=".55"/><path d="M625 208L681 152" stroke="#8A8781" stroke-width="1" opacity=".55"/><path d="M638 208L694 152" stroke="#8A8781" stroke-width="1" opacity=".55"/><path d="M651 208L707 152" stroke="#8A8781" stroke-width="1" opacity=".55"/><path d="M664 208L720 152" stroke="#8A8781" stroke-width="1" opacity=".55"/><path d="M677 208L733 152" stroke="#8A8781" stroke-width="1" opacity=".55"/><path d="M690 208L746 152" stroke="#8A8781" stroke-width="1" opacity=".55"/><path d="M703 208L759 152" stroke="#8A8781" stroke-width="1" opacity=".55"/><path d="M716 208L772 152" stroke="#8A8781" stroke-width="1" opacity=".55"/><path d="M729 208L785 152" stroke="#8A8781" stroke-width="1" opacity=".55"/><path d="M742 208L798 152" stroke="#8A8781" stroke-width="1" opacity=".55"/></g>
    <rect x="664" y="152" width="72" height="56" fill="none"
      stroke="#F2F1EE" stroke-width="1.6"/>
    <text x="700.0" y="244" fill="#8A8781" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
      font-size="9.5" text-anchor="middle" letter-spacing="1">OBSTACLE</text>
    <ellipse id="obstWarn" cx="700.0" cy="180.0" rx="58.0" ry="50.0"
      fill="none" stroke="#E05316" stroke-width="1.3" stroke-dasharray="4 4"/>
  </g>
  <path id="flownA" d="M150,316 L320,150 L585,116" fill="none" stroke="#E05316" stroke-width="2.2" stroke-dasharray="504.8" stroke-dashoffset="504.8"/>
  <path id="dev" d="M585,116 L648,98 L730,118 L812,244" fill="none" stroke="#E05316" stroke-width="2.2" stroke-dasharray="7 5" opacity="0"/>
  <path id="flownB" d="M812,244 L536,342" fill="none" stroke="#E05316" stroke-width="2.2" stroke-dasharray="292.9" stroke-dashoffset="292.9"/>
  <path id="rtl" d="M536,342 L150,316" fill="none" stroke="#E05316"
    stroke-width="2.2" stroke-dasharray="386.9"/>

    <g>
      <circle cx="320" cy="150" r="11" fill="#131314" stroke="#8A8781" stroke-width="1.6"/>
      <circle id="wpOn0" cx="320" cy="150" r="11" fill="#E05316"/>
      <text x="320" y="154" fill="#8A8781" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11"
        text-anchor="middle">1</text>
      <text id="wpNum0" x="320" y="154" fill="#131314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="11" text-anchor="middle">1</text>
    </g>
    <g>
      <circle cx="585" cy="116" r="11" fill="#131314" stroke="#8A8781" stroke-width="1.6"/>
      <circle id="wpOn1" cx="585" cy="116" r="11" fill="#E05316"/>
      <text x="585" y="120" fill="#8A8781" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11"
        text-anchor="middle">2</text>
      <text id="wpNum1" x="585" y="120" fill="#131314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="11" text-anchor="middle">2</text>
    </g>
    <g>
      <circle cx="812" cy="244" r="11" fill="#131314" stroke="#8A8781" stroke-width="1.6"/>
      <circle id="wpOn2" cx="812" cy="244" r="11" fill="#E05316"/>
      <text x="812" y="248" fill="#8A8781" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11"
        text-anchor="middle">3</text>
      <text id="wpNum2" x="812" y="248" fill="#131314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="11" text-anchor="middle">3</text>
    </g>
    <g>
      <circle cx="536" cy="342" r="11" fill="#131314" stroke="#8A8781" stroke-width="1.6"/>
      <circle id="wpOn3" cx="536" cy="342" r="11" fill="#E05316"/>
      <text x="536" y="346" fill="#8A8781" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11"
        text-anchor="middle">4</text>
      <text id="wpNum3" x="536" y="346" fill="#131314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="11" text-anchor="middle">4</text>
    </g>

  <g transform="translate(150,316)">
    <rect x="-13" y="-13" width="26" height="26" fill="none" stroke="#8A8781" stroke-width="1.6"/>
    <text x="0" y="30" fill="#8A8781" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10"
      text-anchor="middle" letter-spacing="1">HOME</text>
    <g id="ping" fill="none" stroke="#E05316" stroke-width="1.6">
      <circle r="7"/><circle r="7"/><circle r="7"/></g>
  </g>

  <g id="drone">
    <g id="rotor" fill="#8A8781">
      <circle cx="-17" cy="-10" r="7"/><circle cx="17" cy="-10" r="7"/>
      <circle cx="-17" cy="10" r="7"/><circle cx="17" cy="10" r="7"/>
      <circle cx="0" cy="-15" r="7"/><circle cx="0" cy="15" r="7"/>
    </g>
    <path d="M-17-10L17 10M17-10L-17 10M0-15V15" stroke="#F2F1EE" stroke-width="2"/>
    <circle r="7.5" fill="#F2F1EE"/>
  </g>

  <g id="devChip" transform="translate(700.0,106)">
    <rect x="-96" y="-15" width="192" height="22" rx="2" fill="#0A0A0A"
      stroke="#E05316" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="0" y="1" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5"
      text-anchor="middle" letter-spacing="0.6">DEVIATE · Phase 6, not built</text>
  </g>

  <g id="armed" transform="translate(800,60)">
    <circle r="4" cx="0" cy="-4" fill="#E05316"/>
    <text x="12" y="0" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11"
      letter-spacing="1.6">ARMED</text>
  </g>

  <g id="ticker">
    <text id="p0" x="56" y="398" fill="#8A8781" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">operator plots 4 coordinates</text>
    <text id="p1" x="56" y="398" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">WP_BEGIN{4}  →  WP{i,lat,lon,alt} ×4, each ACKed  →  WP_END</text>
    <text id="p2" x="56" y="398" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">validated: 0 &lt; alt ≤ 50 m  →  ACK{uploaded}  →  CONFIRM  →  ARMED</text>
    <text id="p3" x="56" y="398" fill="#F2F1EE" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">AUTO.TAKEOFF  →  first waypoint altitude</text>
    <text id="p4" x="56" y="398" fill="#F2F1EE" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">AUTO.MISSION  ·  flying the circuit</text>
    <text id="p4b" x="56" y="398" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">OAK-D depth  →  obstacle ahead  →  deviating ·  Phase 6, not built</text>
    <text id="p4c" x="56" y="398" fill="#F2F1EE" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">clear  ·  back on the uploaded route</text>
    <text id="p5" x="56" y="398" fill="#F2F1EE" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">RTL  ·  the mission's own last item</text>
    <text id="p6" x="56" y="398" fill="#F2F1EE" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">landed  ·  disarmed  ·  DONE{result}</text>
    <text id="p7" x="56" y="398" fill="#8A8781" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1">Target system — Phase 5 in docs/ROADMAP.md · upload, gate and RTL bench-tested; GPS not yet fitted</text>
  </g>
</svg>
