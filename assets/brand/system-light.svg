<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 214" width="900" height="214">
  <title>Venator — a command over 915 MHz LoRa, relayed to the flight controller, and the reply home</title>
  <style>
    /* steps(1,end) swaps one caption for the next with no cross-fade, so the
       line reads like a console rather than a slideshow. */
    #ticker text { opacity: 0 }
    #cap0 { animation: vt0 8s steps(1,end) infinite }
    #cap1 { animation: vt1 8s steps(1,end) infinite }
    #cap2 { animation: vt2 8s steps(1,end) infinite }
    #capf { animation: vtf 8s steps(1,end) infinite; opacity: 1 }
    @keyframes vt0 { 0%,15.9% {opacity:1} 16%,100% {opacity:0} }
    @keyframes vt1 { 0%,15.9% {opacity:0} 16%,30.9% {opacity:1} 31%,100% {opacity:0} }
    @keyframes vt2 { 0%,30.9% {opacity:0} 31%,57.9% {opacity:1} 58%,100% {opacity:0} }
    @keyframes vtf { 0%,57.9% {opacity:0} 58%,100% {opacity:1} }

    /* Everything that moves is in #packets, so this leaves the plain diagram. */
    @media (prefers-reduced-motion: reduce) {
      #packets { display: none }
      #ticker text { animation: none; opacity: 0 }
      #capf { opacity: 1 }
    }
  </style>
  <rect width="900" height="214" fill="#F2F1EE"/>
  <rect x="40" y="34" width="220" height="120" fill="#FFFFFF" stroke="#DAD8D3" stroke-width="1.5"/><text x="58" y="64" fill="#0A0A0A" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="2.4">GROUND</text><text x="58" y="90" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">ground/gcs_client.py</text><text x="58" y="109" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">laptop · any OS</text><text x="58" y="128" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">menu, commands, replies</text>
  <rect x="340" y="34" width="220" height="120" fill="#FFFFFF" stroke="#DAD8D3" stroke-width="1.5"/><text x="358" y="64" fill="#0A0A0A" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="2.4">DRONE</text><text x="358" y="90" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">drone/c2_server.py</text><text x="358" y="109" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">Jetson Orin Nano</text><text x="358" y="128" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">missions · camera · checks</text>
  <rect x="640" y="34" width="220" height="120" fill="#FFFFFF" stroke="#DAD8D3" stroke-width="1.5"/><text x="658" y="64" fill="#0A0A0A" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="2.4">AIRFRAME</text><text x="658" y="90" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">Pixhawk 2.4.8</text><text x="658" y="109" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">PX4 v1.13.3</text><text x="658" y="128" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">hexarotor</text>
  <path d="M260 94h72" stroke="#E05316" stroke-width="2" opacity="1"/><path d="M331 88l8 6-8 6" fill="#E05316" opacity="1"/><text x="300.0" y="78" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" letter-spacing="1.4" opacity="1">915 MHz</text><text x="300.0" y="118" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" text-anchor="middle">LoRa SF7</text>
  <path d="M560 94h72" stroke="#0A0A0A" stroke-width="2" opacity=".8"/><path d="M631 88l8 6-8 6" fill="#0A0A0A" opacity=".8"/><text x="600.0" y="78" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" letter-spacing="1.4" opacity=".8">MAVLink</text><text x="600.0" y="118" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" text-anchor="middle">USB</text>
  <g id="packets">
    <g id="hotLora1" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;.6;.6;0;0" keyTimes="0;0.02;0.13;0.15;1"/>
      <path d="M260 94h72" stroke="#E05316" stroke-width="2"/>
      <path d="M331 88l8 6-8 6" fill="#E05316"/>
    </g>
    <g id="hotLora2" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;.6;.6;0;0" keyTimes="0;0.43;0.45;0.56;0.58;1"/>
      <path d="M260 94h72" stroke="#E05316" stroke-width="2"/>
    </g>
    <g id="hotMav1" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;.6;.6;0;0" keyTimes="0;0.16;0.18;0.25;0.27;1"/>
      <path d="M560 94h72" stroke="#0A0A0A" stroke-width="2"/>
      <path d="M631 88l8 6-8 6" fill="#0A0A0A"/>
    </g>
    <g id="hotMav2" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;.6;.6;0;0" keyTimes="0;0.31;0.33;0.4;0.42;1"/>
      <path d="M560 94h72" stroke="#0A0A0A" stroke-width="2"/>
    </g>
    <rect id="hitDrone" x="340" y="34" width="220" height="120" fill="none"
      stroke="#E05316" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;.9;0;0" keyTimes="0;0.145;0.155;0.25;1"/>
    </rect>
    <rect id="hitAirframe" x="640" y="34" width="220" height="120" fill="none"
      stroke="#0A0A0A" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;.9;0;0" keyTimes="0;0.265;0.275;0.37;1"/>
    </rect>
    <rect id="hitGround" x="40" y="34" width="220" height="120" fill="none"
      stroke="#E05316" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;.9;0;0" keyTimes="0;0.575;0.585;0.68;1"/>
    </rect>
    <g opacity="0" id="pkLora1">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
        keyPoints="0;1;1" keyTimes="0;0.15;1" path="M262,94 H336"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;1;1;0;0" keyTimes="0;0.012;0.138;0.15;1"/>
      <circle r="6" fill="none" stroke="#E05316" stroke-width="1.2" opacity=".4">
        <animate attributeName="r" values="5;10;5" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".45;0;.45" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.4" fill="#E05316"/>
    </g>
    <g opacity="0" id="pkMav1">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
        keyPoints="0;0;1;1" keyTimes="0;0.16;0.27;1" path="M562,94 H636"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.16;0.172;0.258;0.27;1"/>
      <circle r="6" fill="none" stroke="#0A0A0A" stroke-width="1.2" opacity=".4">
        <animate attributeName="r" values="5;10;5" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".45;0;.45" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.4" fill="#0A0A0A"/>
    </g>
    <g opacity="0" id="pkMav2">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
        keyPoints="0;0;1;1" keyTimes="0;0.31;0.42;1" path="M636,94 H562"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.31;0.322;0.408;0.42;1"/>
      <circle r="6" fill="none" stroke="#0A0A0A" stroke-width="1.2" opacity=".4">
        <animate attributeName="r" values="5;10;5" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".45;0;.45" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.4" fill="#0A0A0A"/>
    </g>
    <g opacity="0" id="pkLora2">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
        keyPoints="0;0;1;1" keyTimes="0;0.43;0.58;1" path="M336,94 H262"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.43;0.442;0.568;0.58;1"/>
      <circle r="6" fill="none" stroke="#E05316" stroke-width="1.2" opacity=".4">
        <animate attributeName="r" values="5;10;5" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".45;0;.45" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.4" fill="#E05316"/>
    </g>
  </g>
  <g id="ticker">
    <text id="cap0" x="40" y="192" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.2">GROUND  →  {"t":"cmd","seq":41}  →  915 MHz SF7</text>
    <text id="cap1" x="40" y="192" fill="#0A0A0A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.2">DRONE  →  MAVLink  →  Pixhawk  ·  command relayed</text>
    <text id="cap2" x="40" y="192" fill="#E05316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.2">{"t":"ack","seq":41}  →  the reply comes back the same way</text>
    <text id="capf" x="40" y="192" fill="#6E6B66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.2">radio/protocol.py — newline JSON, one packet per message, spoken by both ends</text>
  </g>
</svg>