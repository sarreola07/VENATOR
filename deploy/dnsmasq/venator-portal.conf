# Venator captive portal — DNS and DHCP for phones on the drone's own network.
#
# Installed to /etc/NetworkManager/dnsmasq-shared.d/ by deploy/field_mode.sh.
# NetworkManager starts its own dnsmasq for a connection with
# ipv4.method=shared and passes --conf-dir for that directory, so these
# directives apply to the VenatorDrone access point and nothing else.
#
# IMPORTANT: --conf-dir is read ONCE, when dnsmasq starts. dnsmasq's inotify
# watches --hostsdir / --dhcp-optsdir / --addn-hosts, NOT --conf-dir, so
# editing this file does nothing until the connection is cycled:
#
#     sudo nmcli connection down venator-hotspot
#     sudo nmcli connection up   venator-hotspot
#
# Syntax check without applying:
#     dnsmasq --test --conf-file=/etc/NetworkManager/dnsmasq-shared.d/venator-portal.conf

# --- the friendly name -------------------------------------------------------
# DNS is case-insensitive (RFC 4343), so Venatordrone.com, VENATORDRONE.COM and
# venatordrone.com all land here. The name is deliberately served over plain
# HTTP: see docs/FIELD_MODE.md for why HTTPS cannot work for a captive portal.
address=/venatordrone.com/10.42.0.1

# --- operating-system captive-portal probes ---------------------------------
# Every OS decides whether a network has internet by fetching a URL it controls
# and checking the answer. Without these lines those names fail to resolve, the
# phone concludes "no internet" and shows a bare warning triangle WITHOUT ever
# opening a portal window. Resolving them to us is what makes the popup fire.
address=/captive.apple.com/10.42.0.1              # iOS, macOS
address=/connectivitycheck.gstatic.com/10.42.0.1  # Android
address=/connectivitycheck.android.com/10.42.0.1  # Android, older
address=/clients3.google.com/10.42.0.1            # Android, older
address=/detectportal.firefox.com/10.42.0.1       # Firefox
address=/www.msftconnecttest.com/10.42.0.1        # Windows NCSI
address=/msftconnecttest.com/10.42.0.1
# Windows calls a network "internet" only if this resolves to 131.107.255.255.
# Pointing it at us is what makes Windows say "portal" instead.
address=/dns.msftncsi.com/10.42.0.1
address=/nmcheck.gnome.org/10.42.0.1              # GNOME / NetworkManager

# --- the modern path: RFC 8908 Captive Portal API ---------------------------
# iOS 14+ and Android 11+ read this DHCP option, fetch the JSON at that URL and
# open its user-portal-url directly. No request interception, no certificate
# warning, and nothing for the operator to type. This is the line that actually
# delivers "a default pop-up window"; everything above is the fallback for
# older devices.
#
# Quoted so dnsmasq sends it as a text option rather than trying to parse the
# URL as an address list.
dhcp-option=114,"http://venatordrone.com/captive-portal-api"

# --- make sure we are the DNS the client uses -------------------------------
# NetworkManager always sends option:router, but does not reliably send a DNS
# server when it has no upstream of its own. A client that then falls back to a
# hardcoded 8.8.8.8 would bypass every line above.
dhcp-option=option:dns-server,10.42.0.1

# --- deliberately NOT set ----------------------------------------------------
# address=/#/10.42.0.1
#     A blanket wildcard resolving every name to the drone. It would work, but
#     it destroys the phone's internet whenever the Jetson DOES have an uplink
#     to share (Ethernet plugged in at the bench). The targeted list above
#     costs nothing and degrades gracefully instead.
#
# no-resolv
#     NetworkManager starts this dnsmasq with --conf-file=/dev/null and does
#     NOT pass no-resolv, so it forwards to /etc/resolv.conf. Leaving that
#     alone is what lets a shared uplink keep working. Setting no-resolv would
#     make the drone a black hole for all other DNS.
